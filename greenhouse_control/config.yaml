name: "GreenhouseControl-io"
slug: "greenhouse_control"
description: "Autonomous climate, VPD, irrigation, and lighting management for greenhouses"
version: "0.1.0"
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:greenhouse"
panel_title: "Greenhouse"
options:
  log_level: "info"
  refresh_interval: 30
  zones:
    - name: "Main Zone"
      target_vpd_min: 0.8
      target_vpd_max: 1.2
      temp_sensor: ""
      humidity_sensor: ""
      leaf_temp_sensor: ""
      leaf_temp_offset: -2.0
      heater_switch: ""
      cooler_switch: ""
      exhaust_fan_switch: ""
      humidifier_switch: ""
      irrigation_valve: ""
      soil_moisture_sensor: ""
      soil_moisture_target: 45
schema:
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"
  refresh_interval: "int(5,300)"
  zones:
    - name: "str"
      target_vpd_min: "float(0.1,5.0)"
      target_vpd_max: "float(0.1,5.0)"
      temp_sensor: "str?"
      humidity_sensor: "str?"
      leaf_temp_sensor: "str?"
      leaf_temp_offset: "float(-10.0,10.0)?"
      heater_switch: "str?"
      cooler_switch: "str?"
      exhaust_fan_switch: "str?"
      humidifier_switch: "str?"
      irrigation_valve: "str?"
      soil_moisture_sensor: "str?"
      soil_moisture_target: "float(0,100)?"
