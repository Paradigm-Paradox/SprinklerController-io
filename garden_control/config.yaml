name: "GardenControl-io"
slug: "garden_control"
description: "Intelligent garden bed management, crop companion tracking, and adaptive ET irrigation for Home Assistant"
version: "0.1.0"
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:sprout"
panel_title: "Garden Control"
options:
  log_level: "info"
  weather_entity: ""
  cistern_sensor_entity: ""
  cistern_minimum_pct: 15.0
  max_concurrent_zones: 1
  solar_coordination_enabled: false
  solar_power_entity: ""
  cycle_and_soak_default: true
  zones:
    - id: "zone_1"
      name: "Main Vegetable Beds"
      valve_entity: ""
      moisture_sensor_entity: ""
      cycle_minutes: 8
      soak_minutes: 15
      max_duration_minutes: 45
      flow_rate_lpm: 12.0
schema:
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"
  weather_entity: "str?"
  cistern_sensor_entity: "str?"
  cistern_minimum_pct: "float(0,100)?"
  max_concurrent_zones: "int(1,8)?"
  solar_coordination_enabled: "bool?"
  solar_power_entity: "str?"
  cycle_and_soak_default: "bool?"
  zones:
    - id: "str"
      name: "str"
      valve_entity: "str?"
      moisture_sensor_entity: "str?"
      cycle_minutes: "int(1,60)?"
      soak_minutes: "int(1,60)?"
      max_duration_minutes: "int(5,180)?"
      flow_rate_lpm: "float(0.1,100.0)?"
