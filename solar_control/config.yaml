name: "SolarControl-io"
slug: "solar_control"
description: "Intelligent solar PV, battery BESS optimization, dynamic excess diversion, and tariff arbitrage"
version: "0.1.0"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:solar-power"
panel_title: "SolarControl"

map:
  - config:rw
  - share:rw

options:
  log_level: "info"
  refresh_interval: 5
  operating_mode: "auto"
  solar:
    inverter_power_sensor: ""
    daily_yield_sensor: ""
    forecast_sensor: ""
  battery:
    enabled: false
    power_sensor: ""
    soc_sensor: ""
    min_soc_reserve: 20
    max_soc_limit: 95
    max_charge_power_w: 5000
    max_discharge_power_w: 5000
    charge_rate_entity: ""
    discharge_rate_entity: ""
  grid:
    meter_power_sensor: ""
    zero_export: false
    max_export_power_w: 10000
  tariff:
    dynamic_pricing_enabled: false
    price_sensor: ""
    export_price_sensor: ""
    negative_price_curtailment: true
  diversions: []

schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  refresh_interval: int(2,60)?
  operating_mode: list(auto|self_consumption|tou_arbitrage|backup_reserve|manual)?
  solar:
    inverter_power_sensor: str?
    daily_yield_sensor: str?
    forecast_sensor: str?
  battery:
    enabled: bool?
    power_sensor: str?
    soc_sensor: str?
    min_soc_reserve: int(5,100)?
    max_soc_limit: int(50,100)?
    max_charge_power_w: int(500,50000)?
    max_discharge_power_w: int(500,50000)?
    charge_rate_entity: str?
    discharge_rate_entity: str?
  grid:
    meter_power_sensor: str?
    zero_export: bool?
    max_export_power_w: int(0,50000)?
  tariff:
    dynamic_pricing_enabled: bool?
    price_sensor: str?
    export_price_sensor: str?
    negative_price_curtailment: bool?
  diversions:
    - name: str
      type: list(switch|pwm_diverter|evse|climate)
      entity_id: str
      power_sensor: str?
      priority: int(1,10)
      min_power_w: int(0,20000)?
      max_power_w: int(0,20000)?
