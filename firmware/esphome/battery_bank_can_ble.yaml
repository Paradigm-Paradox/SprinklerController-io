# BatteryBankControl-io: Stationary LiFePO4 Battery Rack Telemetry & BMS Bridge
# Part of the Paradigm-Paradox Smart Homestead Ecosystem (Local-First)
# Hardware: ESP32 or ESP32-S3 with SN65HVD230 3.3V CAN/TWAI Transceiver + BLE Client

esphome:
  name: battery-bank-controller
  friendly_name: "Battery Bank Controller"
  comment: "Local-first CAN bus & BLE BMS monitor for homestead energy storage"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: "!secret wifi_ssid"
  password: "!secret wifi_password"

api:
  encryption:
    key: "!secret battery_noise_key"

ota:
  - platform: esphome

logger:
  level: INFO

# TWAI (Two-Wire Automotive Interface / CAN Bus) Peripheral Configuration:
# GPIO 4: TX to SN65HVD230 CTX
# GPIO 5: RX from SN65HVD230 CRX
canbus:
  - platform: esp32_can
    id: can_bus_bms
    tx_pin: GPIO4
    rx_pin: GPIO5
    can_id: 1
    bit_rate: 500kbps

# BLE Client Tracker for Daly / JBD / JK Smart BMS:
esp32_ble_tracker:

sensor:
  # Pylontech / CAN Bus Frame 0x359: Protection & Alarms
  # Pylontech / CAN Bus Frame 0x356: Voltage (0.01V), Current (0.1A), Temp (0.1C)
  # Pylontech / CAN Bus Frame 0x355: State of Charge (SoC %) & State of Health (SoH %)

  - platform: template
    name: "Battery Bank Bus Voltage"
    id: bus_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement

  - platform: template
    name: "Battery Bank Net Current"
    id: net_current
    unit_of_measurement: "A"
    accuracy_decimals: 1
    device_class: current
    state_class: measurement

  - platform: template
    name: "Battery Bank State of Charge"
    id: battery_soc
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    state_class: measurement

  - platform: template
    name: "Battery Lowest Cell Voltage"
    id: min_cell_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement

  - platform: template
    name: "Battery Max Cell Temperature"
    id: max_cell_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement

binary_sensor:
  - platform: template
    name: "Battery Charge High Cutoff Alarm"
    id: bms_overvoltage_alarm
    device_class: problem

  - platform: template
    name: "Battery Discharge Low Cutoff Alarm"
    id: bms_undervoltage_alarm
    device_class: problem
