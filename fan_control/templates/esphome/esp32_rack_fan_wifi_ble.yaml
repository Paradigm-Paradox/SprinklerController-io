substitutions:
  name: "esp32-rack-fan-wifi-ble"
  friendly_name: "Rack Fan Controller (Wi-Fi + BLE)"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Native Home Assistant API with edge failsafe
api:
  services:
    - service: set_fan_speed
      variables:
        speed_pct: int
      then:
        - output.set_level:
            id: fan_pwm_1
            level: !lambda 'return speed_pct / 100.0;'

ota:
  - platform: esphome

wifi:
  ssid: "!secret wifi_ssid"
  password: "!secret wifi_password"
  ap:
    ssid: "Rack-Fan-Fallback"
    password: "!secret fallback_password"

captive_portal:

# Bluetooth Low Energy Tracker for wireless rack temp sensors (e.g. Xiaomi / Inkbird)
esp32_ble_tracker:

sensor:
  # Dallas 1-Wire Temperature Sensor (Rack Exhaust Probe)
  - platform: dallas_temp
    address: 0x1234567890abcdef
    name: "Rack Exhaust Temperature"
    id: rack_exhaust_temp
    update_interval: 5s

  # Tachometer RPM Sensor (Fan 1)
  - platform: pulse_counter
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
    name: "Rack Fan 1 RPM"
    id: fan_1_rpm
    unit_of_measurement: "RPM"
    filters:
      # Standard 4-pin fans emit 2 pulses per revolution -> (pulses/min) / 2 = RPM
      - multiply: 30.0
    accuracy_decimals: 0
    update_interval: 2s

  # Tachometer RPM Sensor (Fan 2)
  - platform: pulse_counter
    pin:
      number: GPIO19
      mode:
        input: true
        pullup: true
    name: "Rack Fan 2 RPM"
    id: fan_2_rpm
    unit_of_measurement: "RPM"
    filters:
      - multiply: 30.0
    accuracy_decimals: 0
    update_interval: 2s

# PWM Hardware Outputs (Standard 25 kHz for 4-Pin PC / Rack Fans)
output:
  - platform: ledc
    pin: GPIO22
    id: fan_pwm_1
    frequency: 25000 Hz

  - platform: ledc
    pin: GPIO23
    id: fan_pwm_2
    frequency: 25000 Hz

# Home Assistant Fan Entities
fan:
  - platform: speed
    output: fan_pwm_1
    name: "Rack Exhaust Fan 1"
    id: fan_channel_1

  - platform: speed
    output: fan_pwm_2
    name: "Rack Exhaust Fan 2"
    id: fan_channel_2

# Edge Watchdog: If Home Assistant is disconnected for > 60s, spin up fans to 75% for safety
interval:
  - interval: 10s
    then:
      - if:
          condition:
            not:
              api.connected:
          then:
            - logger.log: "HA disconnected! Activating edge thermal failsafe (75% fan speed)."
            - output.set_level:
                id: fan_pwm_1
                level: 0.75
            - output.set_level:
                id: fan_pwm_2
                level: 0.75
