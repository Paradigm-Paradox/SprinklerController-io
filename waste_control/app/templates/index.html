<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WasteControl-io</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #0a0f0d;
      --bg-card: #121a15;
      --border-color: #1e3328;
      --accent-gold: #e2b755;
      --accent-cyan: #22d3ee;
      --accent-green: #10b981;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 18px;
      margin-bottom: 28px;
    }

    .branding {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .branding img {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      border: 1px solid var(--accent-gold);
    }

    .title-group h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }

    .title-group p {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-family: 'Fira Code', monospace;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-family: 'Fira Code', monospace;
      padding: 6px 12px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--stream-color, var(--accent-gold));
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .stream-name {
      font-size: 1.15rem;
      font-weight: 600;
    }

    .stream-badge {
      font-size: 0.75rem;
      font-family: 'Fira Code', monospace;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .pickup-highlight {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 16px;
      border: 1px dashed var(--border-color);
    }

    .pickup-highlight .days {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .pickup-highlight .date-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .bin-telemetry {
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }

    .gauge-bar-bg {
      background: rgba(255, 255, 255, 0.08);
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 6px;
      margin-bottom: 12px;
    }

    .gauge-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-green), var(--accent-gold));
      width: 0%;
      transition: width 0.6s ease;
    }

    .telemetry-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    button {
      flex: 1;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: 500;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: var(--accent-gold);
      color: #000;
      border-color: var(--accent-gold);
    }

    footer {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
      font-family: 'Fira Code', monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="branding">
        <img src="icon.png" alt="WasteControl-io Logo" onerror="this.src='logo.png'" />
        <div class="title-group">
          <h1>WasteControl-io</h1>
          <p>Paradigm-Paradox • Smart Waste & Bin Telemetry</p>
        </div>
      </div>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span id="system-status">ACTIVE</span>
      </div>
    </header>

    <h2 class="section-title">🚛 Waste Collection Streams</h2>
    <div id="streams-grid" class="grid">
      <!-- Injected via JavaScript -->
    </div>

    <footer>
      WasteControl-io v0.1.0 • Connected to Home Assistant Ingress
    </footer>
  </div>

  <script>
    async function loadData() {
      try {
        const res = await fetch('api/status');
        const data = await res.json();
        renderStreams(data.streams);
      } catch (err) {
        console.error("Failed to load status:", err);
      }
    }

    function renderStreams(streams) {
      const grid = document.getElementById('streams-grid');
      grid.innerHTML = '';

      streams.forEach(s => {
        const daysText = s.schedule.days_remaining === 0 
          ? 'TODAY' 
          : (s.schedule.days_remaining === 1 ? 'TOMORROW' : `${s.schedule.days_remaining} Days`);

        const fillPercent = s.bin ? s.bin.fill_level_percent : 0;
        const location = s.bin ? s.bin.location.toUpperCase() : 'UNKNOWN';

        const card = document.createElement('div');
        card.className = 'card';
        card.style.setProperty('--stream-color', s.color);

        card.innerHTML = `
          <div class="card-header">
            <div class="stream-name">${s.name}</div>
            <div class="stream-badge">${s.schedule_type.toUpperCase()}</div>
          </div>

          <div class="pickup-highlight">
            <div class="days">${daysText}</div>
            <div class="date-label">Next Collection: <b>${s.schedule.next_date || 'N/A'}</b> (${s.pickup_day})</div>
          </div>

          ${s.bin_monitor ? `
          <div class="bin-telemetry">
            <div class="telemetry-row">
              <span>Bin Fill Level</span>
              <b>${fillPercent}%</b>
            </div>
            <div class="gauge-bar-bg">
              <div class="gauge-bar-fill" style="width: ${fillPercent}%;"></div>
            </div>
            <div class="telemetry-row">
              <span>Bin Location</span>
              <b>📍 ${location}</b>
            </div>
            <div class="actions">
              <button onclick="setLocation('${s.id}', 'storage')">At Storage</button>
              <button onclick="setLocation('${s.id}', 'curb')">At Curb</button>
            </div>
          </div>
          ` : ''}
        `;
        grid.appendChild(card);
      });
    }

    async function setLocation(streamId, location) {
      try {
        await fetch(`api/bin/${streamId}/location`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ location })
        });
        loadData();
      } catch (e) {
        console.error(e);
      }
    }

    loadData();
    setInterval(loadData, 10000);
  </script>
</body>
</html>
