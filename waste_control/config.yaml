name: "WasteControl-io"
slug: "waste_control"
description: "Intelligent waste, recycling, compost and bin telemetry orchestration"
url: "https://github.com/Paradigm-Paradox/WasteControl-io"
version: "0.1.0"
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:trash-can-outline"
panel_title: "WasteControl"
map:
  - config:rw
  - share:rw
options:
  log_level: "info"
  refresh_interval: 60
  mqtt:
    enabled: true
    host: "core-mosquitto"
    port: 1883
    username: ""
    password: ""
    topic_prefix: "wastecontrol"
  streams:
    - id: "trash"
      name: "Household Trash"
      color: "#2E7D32"
      schedule_type: "weekly"
      pickup_day: "Tuesday"
      holiday_delay: true
      bin_monitor: true
      empty_depth_cm: 95
      full_depth_cm: 15
    - id: "recycling"
      name: "Recycling"
      color: "#1565C0"
      schedule_type: "biweekly_even"
      pickup_day: "Tuesday"
      holiday_delay: true
      bin_monitor: true
      empty_depth_cm: 95
      full_depth_cm: 15
    - id: "yard_waste"
      name: "Yard Waste"
      color: "#8D6E63"
      schedule_type: "weekly"
      pickup_day: "Wednesday"
      holiday_delay: true
      bin_monitor: false
schema:
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"
  refresh_interval: "int(10,3600)"
  mqtt:
    enabled: bool
    host: str
    port: port
    username: str?
    password: password?
    topic_prefix: str
  streams:
    - id: str
      name: str
      color: str?
      schedule_type: "list(weekly|biweekly_odd|biweekly_even|monthly|custom)"
      pickup_day: "list(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)"
      holiday_delay: bool?
      bin_monitor: bool?
      empty_depth_cm: float?
      full_depth_cm: float?
