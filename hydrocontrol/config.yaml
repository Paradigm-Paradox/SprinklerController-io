name: "HydroControl-io"
slug: "hydrocontrol"
description: "Intelligent Hydroponic Management, Automated Dosing, Irrigation, and Reservoir Monitoring"
version: "0.1.0"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8723
panel_icon: "mdi:sprout"
panel_title: "HydroControl"
init: false

map:
  - config:rw
  - share:rw

options:
  log_level: "info"
  system_name: "Hydroponics Main"
  reservoir_capacity_liters: 50.0
  sensors:
    ph_sensor_entity: ""
    ec_sensor_entity: ""
    water_temp_entity: ""
    water_level_entity: ""
  targets:
    target_ph: 6.0
    ph_tolerance: 0.2
    target_ec_ms: 1.8
    ec_tolerance: 0.1
    target_water_temp_c: 20.0
  dosing:
    enabled: false
    ph_down_pump_entity: ""
    ph_up_pump_entity: ""
    nutrient_a_pump_entity: ""
    nutrient_b_pump_entity: ""
    pump_flow_rate_ml_min: 60.0
    max_single_dose_ml: 10.0
    dose_mixing_delay_sec: 900
    daily_safety_cap_ml: 100.0
  irrigation:
    pump_entity: ""
    mode: "continuous"
    cycle_on_minutes: 15
    cycle_off_minutes: 45

schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  system_name: str?
  reservoir_capacity_liters: float?
  sensors:
    ph_sensor_entity: str?
    ec_sensor_entity: str?
    water_temp_entity: str?
    water_level_entity: str?
  targets:
    target_ph: float?
    ph_tolerance: float?
    target_ec_ms: float?
    ec_tolerance: float?
    target_water_temp_c: float?
  dosing:
    enabled: bool?
    ph_down_pump_entity: str?
    ph_up_pump_entity: str?
    nutrient_a_pump_entity: str?
    nutrient_b_pump_entity: str?
    pump_flow_rate_ml_min: float?
    max_single_dose_ml: float?
    dose_mixing_delay_sec: int?
    daily_safety_cap_ml: float?
  irrigation:
    pump_entity: str?
    mode: list(continuous|cycle|flood_drain|manual)?
    cycle_on_minutes: int?
    cycle_off_minutes: int?
