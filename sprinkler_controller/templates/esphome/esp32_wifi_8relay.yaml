substitutions:
  name: "sprinkler-node-wifi"
  friendly_name: "Sprinkler Controller Wi-Fi"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Home Assistant API with Encryption
api:
  encryption:
    key: "!secret api_encryption_key"

ota:
  - platform: esphome

wifi:
  ssid: "!secret wifi_ssid"
  password: "!secret wifi_password"
  ap:
    ssid: "Sprinkler-Fallback-AP"

logger:

# Bluetooth Low Energy Tracking for Soil Moisture Probes (e.g. Xiaomi Mi Flora)
esp32_ble_tracker:

# Hardware Fail-safe Relays with Script Watchdogs
switch:
  - platform: gpio
    pin:
      number: GPIO23
      inverted: true # Invert if using active-low relay board
    name: "Zone 1 Front Lawn"
    id: zone_1
    restore_mode: ALWAYS_OFF
    interlock: [zone_1, zone_2, zone_3, zone_4]
    on_turn_on:
      - script.execute: auto_off_zone_1
    on_turn_off:
      - script.stop: auto_off_zone_1

  - platform: gpio
    pin:
      number: GPIO22
      inverted: true
    name: "Zone 2 Back Lawn"
    id: zone_2
    restore_mode: ALWAYS_OFF
    interlock: [zone_1, zone_2, zone_3, zone_4]
    on_turn_on:
      - script.execute: auto_off_zone_2
    on_turn_off:
      - script.stop: auto_off_zone_2

  - platform: gpio
    pin:
      number: GPIO21
      inverted: true
    name: "Zone 3 Garden Beds"
    id: zone_3
    restore_mode: ALWAYS_OFF
    interlock: [zone_1, zone_2, zone_3, zone_4]
    on_turn_on:
      - script.execute: auto_off_zone_3
    on_turn_off:
      - script.stop: auto_off_zone_3

  - platform: gpio
    pin:
      number: GPIO19
      inverted: true
    name: "Zone 4 Shrubs"
    id: zone_4
    restore_mode: ALWAYS_OFF
    interlock: [zone_1, zone_2, zone_3, zone_4]
    on_turn_on:
      - script.execute: auto_off_zone_4
    on_turn_off:
      - script.stop: auto_off_zone_4

# Auto-shutoff safety watchdogs (cancels automatically if zone is turned off early)
script:
  - id: auto_off_zone_1
    mode: restart
    then:
      - delay: 30min
      - switch.turn_off: zone_1

  - id: auto_off_zone_2
    mode: restart
    then:
      - delay: 30min
      - switch.turn_off: zone_2

  - id: auto_off_zone_3
    mode: restart
    then:
      - delay: 30min
      - switch.turn_off: zone_3

  - id: auto_off_zone_4
    mode: restart
    then:
      - delay: 30min
      - switch.turn_off: zone_4

# Pulse Counter Flow Meter (GPM)
sensor:
  - platform: pulse_counter
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
    name: "Water Flow Rate"
    id: water_flow_rate
    unit_of_measurement: "GPM"
    update_interval: 10s
    filters:
      - multiply: 0.132

# Physical Rain Sensor (Normally-Closed Cutoff)
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO17
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Rain Sensor Tripped"
    id: rain_sensor_tripped
