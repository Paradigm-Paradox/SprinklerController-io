name: "SprinklerController-io"
slug: "sprinkler_controller"
description: "Intelligent multi-zone sprinkler & irrigation management with ESP32 edge controller support"
version: "0.1.0"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8708
panel_icon: "mdi:sprinkler-variant"

panel_title: "Sprinklers"
init: false

map:
  - config:rw
  - share:rw

options:
  log_level: "info"
  system_name: "Lawn & Garden Sprinklers"
  safety:
    freeze_lockout_temp_c: 3.0
    rain_delay_hours: 24
    max_zone_runtime_minutes: 60
    concurrent_zone_limit: 1
    master_valve_lead_time_seconds: 5
    master_valve_lag_time_seconds: 3
  weather:
    weather_entity: ""
    rain_sensor_entity: ""
    temp_sensor_entity: ""
    solar_radiation_sensor_entity: ""
  zones:
    - name: "Front Lawn"
      switch_entity: ""
      default_duration_minutes: 15
      cycle_count: 2
      soak_minutes: 10
      flow_rate_gpm: 4.5
      soil_moisture_entity: ""
    - name: "Back Lawn"
      switch_entity: ""
      default_duration_minutes: 20
      cycle_count: 2
      soak_minutes: 15
      flow_rate_gpm: 5.0
      soil_moisture_entity: ""
    - name: "Garden Beds"
      switch_entity: ""
      default_duration_minutes: 10
      cycle_count: 1
      soak_minutes: 0
      flow_rate_gpm: 2.0
      soil_moisture_entity: ""

schema:
  log_level: "list(trace|debug|info|notice|warning|error|fatal)?"
  system_name: "str?"
  safety:
    freeze_lockout_temp_c: "float?"
    rain_delay_hours: "int?"
    max_zone_runtime_minutes: "int?"
    concurrent_zone_limit: "int?"
    master_valve_lead_time_seconds: "int?"
    master_valve_lag_time_seconds: "int?"
  weather:
    weather_entity: "str?"
    rain_sensor_entity: "str?"
    temp_sensor_entity: "str?"
    solar_radiation_sensor_entity: "str?"
  zones:
    - name: "str"
      switch_entity: "str?"
      default_duration_minutes: "int?"
      cycle_count: "int?"
      soak_minutes: "int?"
      flow_rate_gpm: "float?"
      soil_moisture_entity: "str?"
