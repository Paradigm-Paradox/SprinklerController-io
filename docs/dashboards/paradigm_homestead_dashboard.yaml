# MyHomeStead.io: Master Homestead Dashboard
# Local-First Unified View for Home Assistant
# Load this YAML into Home Assistant -> Dashboards -> Add Dashboard (YAML Mode)

title: "MyHomeStead.io"

views:
  # =========================================================================
  # VIEW 1: HOMESTEAD OVERVIEW
  # =========================================================================
  - title: "Overview"
    path: "overview"
    icon: "mdi:home-analytics"
    badges:
      - entity: sensor.solar_inverter_pv_power
        name: "PV Generation"
      - entity: sensor.battery_bank_total_soc
        name: "Battery SoC"
      - entity: sensor.well_casing_water_depth_ft
        name: "Well Depth"
      - entity: sensor.air_quality_indoor_pm2_5
        name: "Indoor PM2.5"
      - entity: binary_sensor.backup_grid_presence
        name: "Grid Power"
    cards:
      - type: horizontal-stack
        cards:
          - type: glance
            title: "⚡ Energy & Grid Status"
            show_name: true
            show_state: true
            entities:
              - entity: sensor.solar_inverter_pv_power
                name: "Solar PV"
              - entity: sensor.battery_bank_total_soc
                name: "Battery"
              - entity: sensor.load_balancer_main_amperage
                name: "Main Draw"
              - entity: binary_sensor.backup_grid_presence
                name: "Grid Active"
          - type: glance
            title: "💧 Water Reserves & Irrigation"
            show_name: true
            show_state: true
            entities:
              - entity: sensor.well_casing_water_depth_ft
                name: "Well Level"
              - entity: sensor.well_system_pressure_psi
                name: "Pressure"
              - entity: sensor.sprinkler_flow_rate_gpm
                name: "Current GPM"
              - entity: binary_sensor.sprinkler_rain_delay_active
                name: "Rain Delay"

      - type: horizontal-stack
        cards:
          - type: entities
            title: "🌱 Growing & Agriculture Vitals"
            entities:
              - entity: sensor.greenhouse_canopy_leaf_vpd
                name: "Greenhouse Leaf VPD"
              - entity: sensor.greenhouse_canopy_air_temp
                name: "Canopy Temperature"
              - entity: sensor.hydro_dwc_reservoir_ph
                name: "Hydro Reservoir pH"
              - entity: sensor.hydro_dwc_reservoir_ec
                name: "Hydro Reservoir EC"
              - entity: sensor.garden_bed_1_soil_moisture
                name: "Bed 1 Moisture"
          - type: entities
            title: "🏡 Homestead & Logistics Vitals"
            entities:
              - entity: sensor.air_quality_indoor_pm2_5
                name: "Indoor Air Quality (PM2.5)"
              - entity: sensor.waste_compost_fill_percent
                name: "Compost Bin Fill"
              - entity: sensor.pantry_bulk_flour_weight_lbs
                name: "Pantry Bulk Grain / Flour"
              - entity: binary_sensor.security_perimeter_alarm
                name: "Perimeter Security"
              - entity: device_tracker.transport_truck_ble
                name: "Homestead Transport"

  # =========================================================================
  # VIEW 2: ENERGY & POWER (SolarControl, BatteryBankControl, BackupPower, LoadBalancer)
  # =========================================================================
  - title: "Energy & Storage"
    path: "energy"
    icon: "mdi:solar-power-variant"
    cards:
      - type: entities
        title: "☀️ Solar PV & Hybrid Inverters (SolarControl-io)"
        entities:
          - entity: sensor.solar_inverter_pv_power
            name: "Total PV Power Generation"
          - entity: sensor.solar_inverter_daily_yield_kwh
            name: "Daily Solar Harvest"
          - entity: sensor.solar_excess_power_diverted
            name: "Excess Solar Diverted to Heat"
          - entity: switch.solar_diverter_immersion_ssr
            name: "Immersion Diverter SSR"

      - type: entities
        title: "🔋 Battery Bank & BMS Telemetry (BatteryBankControl-io)"
        entities:
          - entity: sensor.battery_bank_total_soc
            name: "State of Charge (SoC)"
          - entity: sensor.battery_bank_bus_voltage
            name: "Bus Voltage (V)"
          - entity: sensor.battery_bank_net_current
            name: "Net Charge/Discharge Current"
          - entity: sensor.battery_bank_min_cell_voltage
            name: "Lowest Cell Voltage"
          - entity: sensor.battery_bank_max_cell_temp
            name: "Max Cell Temperature"

      - type: horizontal-stack
        cards:
          - type: entities
            title: "⚡ Backup Power & ATS (BackupPower-io)"
            entities:
              - entity: binary_sensor.backup_grid_presence
                name: "Grid Utility Connection"
              - entity: binary_sensor.backup_ats_position
                name: "Automatic Transfer Switch"
              - entity: switch.backup_generator_autostart
                name: "Generator Auto-Start"
          - type: entities
            title: "⚖️ Load Balancing & Peak Shaving (LoadBalancer-io)"
            entities:
              - entity: sensor.load_balancer_main_amperage
                name: "Main Feeder Current"
              - entity: sensor.load_balancer_evse_allowed_amps
                name: "EVSE Dynamic Amps"
              - entity: switch.load_balancer_shed_secondary_hvac
                name: "HVAC Load Shedding"

  # =========================================================================
  # VIEW 3: WATER LIFELINE (WellPumpControl, SprinklerController, GardenControl, HydroControl)
  # =========================================================================
  - title: "Water & Irrigation"
    path: "water"
    icon: "mdi:water-pump"
    cards:
      - type: entities
        title: "🚰 Borehole & Well Pumping (WellPumpControl-io)"
        entities:
          - entity: sensor.well_casing_water_depth_ft
            name: "Submersible Borehole Depth"
          - entity: sensor.well_system_pressure_psi
            name: "Hydraulic System Pressure"
          - entity: switch.well_pump_contactor
            name: "Well Pump Contactor"
          - entity: binary_sensor.well_pump_dry_run_interlock
            name: "Dry-Run Safety Lockout"

      - type: entities
        title: "💦 Multi-Zone Lawn & Turf (SprinklerController-io)"
        entities:
          - entity: sensor.sprinkler_flow_rate_gpm
            name: "Flow Rate (GPM)"
          - entity: switch.sprinkler_lawn_zone_1_valve
            name: "Zone 1: Front Lawn"
          - entity: switch.sprinkler_lawn_zone_2_valve
            name: "Zone 2: Back Lawn"
          - entity: binary_sensor.sprinkler_freeze_lockout
            name: "Freeze Lockout (< 3°C)"

      - type: horizontal-stack
        cards:
          - type: entities
            title: "🌾 Garden Bed Drip Lines (GardenControl-io)"
            entities:
              - entity: switch.garden_manifold_zone_raised_beds
                name: "Raised Beds Valve"
              - entity: switch.garden_manifold_zone_berry_patch
                name: "Berry Patch Valve"
              - entity: sensor.garden_daily_et0_loss_inches
                name: "Daily Evapotranspiration ($ET_0$)"
          - type: entities
            title: "💧 Closed-Loop Hydroponics (HydroControl-io)"
            entities:
              - entity: switch.hydro_main_recirculation_pump
                name: "Recirculation Pump"
              - entity: sensor.hydro_reservoir_water_temp
                name: "Nutrient Solution Temp"
              - entity: sensor.hydro_reservoir_level_liters
                name: "Reservoir Water Volume"

  # =========================================================================
  # VIEW 4: AGRI & GROWING (GreenhouseControl, SoilSense, HydroControl, GardenControl)
  # =========================================================================
  - title: "Agri & Growing"
    path: "agri"
    icon: "mdi:greenhouse"
    cards:
      - type: entities
        title: "🌿 Precision Greenhouse Climate & VPD (GreenhouseControl-io)"
        entities:
          - entity: sensor.greenhouse_canopy_leaf_vpd
            name: "Canopy Leaf VPD"
          - entity: sensor.greenhouse_canopy_air_temp
            name: "Air Temperature"
          - entity: sensor.greenhouse_canopy_relative_humidity
            name: "Relative Humidity"
          - entity: sensor.greenhouse_daily_light_integral_dli
            name: "Accumulated DLI (mol/m²/day)"
          - entity: switch.greenhouse_exhaust_fan_relay
            name: "Exhaust Fan"
          - entity: switch.greenhouse_ridge_vent_open
            name: "Ridge Vent Actuator"

      - type: horizontal-stack
        cards:
          - type: entities
            title: "🧪 Nutrient & pH Dosing Engine (HydroControl-io)"
            entities:
              - entity: sensor.hydro_dwc_reservoir_ph
                name: "Live pH"
              - entity: sensor.hydro_dwc_reservoir_ec
                name: "Live EC (mS/cm)"
              - entity: switch.hydro_doser_ph_down_pump
                name: "Dosing: pH Down Pump"
              - entity: switch.hydro_doser_nutrient_a_pump
                name: "Dosing: Part A Nutrient"
              - entity: switch.hydro_doser_nutrient_b_pump
                name: "Dosing: Part B Nutrient"
          - type: entities
            title: "🌱 Soil Quality & NPK Array (SoilSense-io)"
            entities:
              - entity: sensor.soil_field_alpha_nitrogen
                name: "Nitrogen (N)"
              - entity: sensor.soil_field_alpha_phosphorus
                name: "Phosphorus (P)"
              - entity: sensor.soil_field_alpha_potassium
                name: "Potassium (K)"
              - entity: sensor.soil_field_alpha_ec
                name: "Soil EC (Salinity)"
              - entity: sensor.soil_field_alpha_moisture
                name: "Volumetric Water Content"

  # =========================================================================
  # VIEW 5: CLIMATE, AIR & VENTILATION (ClimateControl, AirQuality, FanControl)
  # =========================================================================
  - title: "Climate & Air"
    path: "climate"
    icon: "mdi:weather-dust"
    cards:
      - type: entities
        title: "🌬️ Indoor & Homestead Air Quality (AirQuality-io)"
        entities:
          - entity: sensor.air_quality_indoor_pm2_5
            name: "Fine Particulate (PM2.5)"
          - entity: sensor.air_quality_indoor_pm10
            name: "Coarse Particulate (PM10)"
          - entity: sensor.air_quality_indoor_co2_ppm
            name: "True NDIR Carbon Dioxide (CO2)"
          - entity: sensor.air_quality_indoor_voc_index
            name: "Volatile Organic Compounds (VOC)"
          - entity: switch.air_quality_scrubber_hvac
            name: "HEPA Filtration Boost"

      - type: horizontal-stack
        cards:
          - type: entities
            title: "🌡️ HVAC & Heating Zones (ClimateControl-io)"
            entities:
              - entity: climate.homestead_main_hvac
                name: "Main Thermostat"
              - entity: sensor.climate_woodstove_flue_temp
                name: "Wood Stove Flue Temp"
              - entity: switch.climate_fresh_air_damper
                name: "ERV/HRV Economizer"
          - type: entities
            title: "🌀 25kHz PWM Cooling Fans (FanControl.io)"
            entities:
              - entity: fan.fan_rack_exhaust_pwm
                name: "Server Rack PWM Fan"
              - entity: sensor.fan_rack_exhaust_rpm
                name: "Tachometer RPM Feedback"
              - entity: fan.fan_greenhouse_circulation_pwm
                name: "Canopy Circulation Fan"

  # =========================================================================
  # VIEW 6: HOMESTEAD LOGISTICS & SECURITY
  # (SecurityControl, LightingControl, WasteControl, PantryControl, WorkshopControl, TransportControl)
  # =========================================================================
  - title: "Homestead Logistics"
    path: "homestead"
    icon: "mdi:shield-home"
    cards:
      - type: horizontal-stack
        cards:
          - type: entities
            title: "🛡️ Perimeter & Security (SecurityControl-io)"
            entities:
              - entity: binary_sensor.security_perimeter_alarm
                name: "Master Perimeter Status"
              - entity: binary_sensor.security_north_beam_break
                name: "North Infrared Beam"
              - entity: binary_sensor.security_driveway_radar
                name: "24GHz mmWave Driveway Radar"
              - entity: switch.security_gate_lockout
                name: "Main Gate Lockout"
          - type: entities
            title: "💡 Circadian & Facility Lights (LightingControl-io)"
            entities:
              - entity: light.lighting_perimeter_security_led
                name: "Perimeter Security Floods"
              - entity: light.lighting_greenhouse_supplemental_led
                name: "Greenhouse PAR Grow Lights"
              - entity: light.lighting_barn_high_bay
                name: "Barn / Equipment High Bays"

      - type: horizontal-stack
        cards:
          - type: entities
            title: "🗑️ Waste & Telemetry (WasteControl-io)"
            entities:
              - entity: sensor.waste_trash_fill_percent
                name: "Trash Bin Fill Level"
              - entity: sensor.waste_recycle_fill_percent
                name: "Recycling Bin Fill Level"
              - entity: sensor.waste_compost_fill_percent
                name: "Compost Bin Fill Level"
              - entity: binary_sensor.waste_bin_curbside_placed
                name: "Bins Moved to Curb"
          - type: entities
            title: "🥫 Bulk Pantry & Cellar (PantryControl-io)"
            entities:
              - entity: sensor.pantry_bulk_flour_weight_lbs
                name: "Bulk Grain / Flour Weight"
              - entity: sensor.pantry_root_cellar_temp
                name: "Root Cellar Temperature"
              - entity: sensor.pantry_root_cellar_humidity
                name: "Root Cellar Humidity"

      - type: horizontal-stack
        cards:
          - type: entities
            title: "🛠️ Workshop & Blast Gates (WorkshopControl-io)"
            entities:
              - entity: switch.workshop_blast_gate_table_saw
                name: "Table Saw Dust Gate"
              - entity: switch.workshop_dust_collector_main
                name: "Central Dust Collector"
              - entity: binary_sensor.workshop_air_compressor_running
                name: "Air Compressor Status"
          - type: entities
            title: "🚜 Farm Transport & Fleet (TransportControl-io)"
            entities:
              - entity: device_tracker.transport_truck_ble
                name: "Farm Truck Presence"
              - entity: device_tracker.transport_tractor_ble
                name: "Tractor Presence"
              - entity: sensor.transport_garage_bay_distance_in
                name: "Garage Parking Guide"

  # =========================================================================
  # VIEW 7: MASTER CONTROL & DATAHUB (Control-io, DataHub-io)
  # =========================================================================
  - title: "Control & DataHub"
    path: "system"
    icon: "mdi:server-network"
    cards:
      - type: entities
        title: "🧠 Master Homestead Coordination (Control-io)"
        entities:
          - entity: switch.homestead_master_irrigation_enable
            name: "Master Irrigation Enable"
          - entity: switch.homestead_master_solar_priority
            name: "Solar Priority Mode"
          - entity: switch.homestead_grid_island_mode
            name: "Off-Grid Island Mode"
          - entity: switch.homestead_frost_protection_override
            name: "Emergency Frost Heater Override"

      - type: entities
        title: "💾 Local-First DataHub Telemetry (DataHub-io)"
        entities:
          - entity: sensor.datahub_local_db_size_mb
            name: "Local Database Size (MB)"
          - entity: sensor.datahub_ingested_events_per_minute
            name: "Telemetry Ingestion Rate (events/min)"
          - entity: sensor.datahub_nvme_storage_free_gb
            name: "Local NVMe Available Space (GB)"
          - entity: binary_sensor.datahub_backup_status
            name: "Daily Local Backup Status"
          - entity: button.datahub_trigger_local_export
            name: "Export Full Local CSV Telemetry Archive"
